<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To Samanwita</title>
<meta name="description" content="A story, told the long way, for Samanwita's 21st birthday.">
<meta name="theme-color" content="#0a0c17">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="skip-link" href="#app">Skip to story</a>

<canvas id="starfield" aria-hidden="true"></canvas>
<canvas id="celebrate-canvas" aria-hidden="true"></canvas>

<header class="topbar" id="topbar" style="display:none">
  <span class="brand" id="brand"></span>
  <button class="music-btn" id="musicBtn" type="button" aria-label="Play our song">
    <span class="icon"></span>
    <span class="music-label">Play our song</span>
  </button>
</header>

<main id="app">

  <section class="scene is-active" id="scene-prologue" data-mood="prologue">
    <div class="scene-scroll">
      <div class="envelope-wrap" id="envelopeWrap" tabindex="0" role="button" aria-label="Open the letter">
        <div class="envelope">
          <svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="18" width="192" height="108" rx="6" fill="#12162a" stroke="#c9a15c" stroke-width="1.4"/>
            <path d="M4 22 L100 90 L196 22" fill="none" stroke="#c9a15c" stroke-width="1.4"/>
            <g class="flap">
              <path d="M4 18 L100 78 L196 18 Z" fill="#191f3a" stroke="#c9a15c" stroke-width="1.4"/>
            </g>
            <circle cx="100" cy="60" r="7" fill="#c9a15c" opacity="0.85"/>
          </svg>
        </div>
        <div class="envelope-hint">Tap to open</div>
      </div>

      <div class="prologue-letter" id="prologueLetter" style="display:none">
        <div class="address" id="prologueAddress"></div>
        <div id="prologueLines"></div>
        <button class="btn-primary" id="prologueBtn" type="button"></button>
      </div>
    </div>
  </section>

  <!-- Chapters + finale are generated by js/app.js from js/content.js -->

</main>

<footer class="bottombar" id="bottombar" style="display:none">
  <div class="thread-progress" id="threadProgress"></div>
  <div class="navrow">
    <button class="navbtn" id="prevBtn" type="button" aria-label="Previous">
      <span>&#8592;</span>
    </button>
    <div class="navlabel" id="navLabel"></div>
    <button class="navbtn" id="nextBtn" type="button" aria-label="Next">
      <span>&#8594;</span>
    </button>
  </div>
</footer>

<button class="egg-corner" id="eggDoor" type="button" aria-label="?" title="">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="2.5" width="14" height="19" rx="1"/><circle cx="15" cy="12" r="1"/></svg>
</button>

<div class="egg-toast" id="eggToast"></div>

<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
